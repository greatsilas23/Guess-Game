<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lyric Drop — Pixel Reggae Quiz</title>
<style>
  :root{
    --bg:#0b0b0c; --panel:#121317; --ink:#e9eef3;
    --accent:#1dd75f; --accent-2:#ffd247; --bad:#ff4d6d; --muted:#9aa3ad;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
    color:var(--ink); background:radial-gradient(1200px 800px at 70% -20%, #1a1e28 0%, var(--bg) 60%);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .frame{
    width:min(920px,100%); background:linear-gradient(180deg,#141722, #0f1117 40%, #0b0b0c);
    border:1px solid #232532; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid #26283a;
    background:#121420;
  }
  header .dot{width:10px;height:10px;border-radius:50%}
  .red{background:#ff5f57}.amber{background:#febc2e}.green{background:#28c840}
  header h1{font-size:16px; letter-spacing:.6px; margin:0; color:#cbd5e1; font-weight:650}
  main{display:grid; grid-template-columns:220px 1fr; gap:18px; padding:18px}
  .sprite-wrap{
    background:#0e1016; border:1px solid #24263a; border-radius:14px; padding:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .sprite{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  .sprite img{max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated}
  .panel{
    background:#0f121a; border:1px solid #24263a; border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:14px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .pill{
    padding:8px 12px; border:1px solid #2a2d40; border-radius:999px; color:#d5deea; font-size:13px
  }
  .score{margin-left:auto}
  button{
    border:1px solid #2b2e41; background:#141829; color:#e8eef7; border-radius:12px;
    padding:12px 14px; font-weight:650; cursor:pointer; transition:.15s transform,.15s background,.15s border-color;
  }
  button:hover{transform:translateY(-1px); border-color:#3a3e57}
  button:active{transform:translateY(0)}
  .go{background:linear-gradient(180deg,#1fe36c,#0dc65b); border-color:#0dc65b; color:#0b1b10}
  .stop{background:#1a1020; border-color:#3a2345}
  .disabled{opacity:.6; pointer-events:none}
  .choices{display:grid; gap:10px}
  .choices button{
    text-align:left; width:100%; padding:14px; border-radius:12px; font-size:15px; line-height:1.35;
    background:#131722;
  }
  .choices button.correct{outline:2px solid var(--accent)}
  .choices button.wrong{outline:2px solid var(--bad)}
  .feedback{min-height:22px; color:var(--muted)}
  .feedback.good{color:var(--accent)}
  .feedback.bad{color:var(--bad)}
  .progress{
    height:8px; background:#1a1d2b; border-radius:999px; overflow:hidden; border:1px solid #2b2e41;
  }
  .progress > div{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .25s}
  footer{padding:12px 16px 16px; display:flex; gap:10px; justify-content:space-between; align-items:center}
  .tiny{font-size:12px; color:#93a0ad}
  @media (max-width:760px){
    main{grid-template-columns:1fr}
    .sprite-wrap{order:-1}
  }
</style>
</head>
<body>
  <div class="frame" role="application" aria-label="Lyric Drop — music quiz">
    <header>
      <div class="dot red"></div><div class="dot amber"></div><div class="dot green"></div>
      <h1>Lyric Drop</h1>
    </header>

    <main>
      <section class="sprite-wrap">
        <div class="sprite" aria-hidden="true">
          <!-- Replace src with your pixel guitarist image URL -->
          <img id="host-sprite" src="" alt="Pixel reggae guitarist (host)">
        </div>
      </section>

      <section class="panel" id="game">
        <div class="row">
          <div class="pill" id="round-pill">Round 1 / 6</div>
          <div class="pill">Streak <strong id="streak">0</strong></div>
          <div class="pill score">Score <strong id="score">0</strong></div>
        </div>

        <div class="progress" aria-hidden="true">
          <div id="progbar"></div>
        </div>

        <div class="row">
          <button id="playBtn" class="go">Play clip</button>
          <button id="stopBtn" class="stop disabled">Stop</button>
          <button id="nextBtn" class="disabled">Next</button>
        </div>

        <div class="tiny" id="hint">Tap “Play clip”. When the music stops, pick the correct lyric to keep your streak.</div>

        <div class="choices" id="choices" aria-live="polite" aria-label="Lyric options"></div>

        <div class="feedback" id="feedback" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <div class="tiny">Tip: press <b>1–4</b> to answer quickly. Toggle sound with <b>M</b>.</div>
      <div class="tiny">Made with Web Audio (no external files).</div>
    </footer>
  </div>

<script>
/* ------------------------ Content (questions) ------------------------ */
/* These are original sample lines. Replace with your own safely. */
const QUESTIONS = [
  {
    prompt: "Which line comes next?",
    options: [
      "Rhythm on the shoreline, hearts in time",
      "Midnight whispers fade into the dawn",
      "Echoes of steel in the city rain",
      "Silver birds glide over quiet pines"
    ],
    answer: 0
  },
  {
    prompt: "Pick the lyric that fits the vibe:",
    options: [
      "Cables hum and traffic sings",
      "Sunlight skanks across the sea",
      "Paper moons on window glass",
      "Neon storms above the square"
    ],
    answer: 1
  },
  {
    prompt: "Complete the hook:",
    options: [
      "Step light, keep bright, move free",
      "Cold stone roses in the wire",
      "Blue smoke mirrors after tea",
      "Rusted bells below the spire"
    ],
    answer: 0
  },
  {
    prompt: "Best match for the groove:",
    options: [
      "Lanterns drift on easy wind",
      "Copper streets awake at nine",
      "Towers drink the fading light",
      "River writes its crooked line"
    ],
    answer: 3
  },
  {
    prompt: "Stick the landing:",
    options: [
      "Bassline paints the night in green",
      "Clockwork moons forget to shine",
      "Tin can radios confess",
      "Clouds fold neatly into time"
    ],
    answer: 0
  },
  {
    prompt: "Find the chorus piece:",
    options: [
      "Hands up, hearts up, keep the peace",
      "Mountains whistle broken keys",
      "Old guitars grow cedar leaves",
      "Quiet maps forget the east"
    ],
    answer: 0
  }
];

/* -------------------- Minimal audio engine (skank) ------------------- */
/* Generates a short reggae-y riff: offbeat chords + tiny bass drop. */
class Riff {
  constructor(){
    this.ctx = null;
    this.master = null;
    this.muted = false;
  }
  _ensure(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }
  }
  setMuted(m){ this.muted = m; if(this.master) this.master.gain.value = m?0:0.5 }
  async play(duration=3.2){
    this._ensure();
    const ctx = this.ctx;
    const now = ctx.currentTime + 0.05;

    // Simple tempo grid
    const bpm = 88, beat = 60/bpm;
    const bars = Math.max(1, Math.round(duration/(4*beat)));
    const root = 196; // G3-ish
    const prog = [0, 2, 5, 7]; // I, II, IV, V degrees
    const gain = ctx.createGain(); gain.gain.value = this.muted?0:0.45; gain.connect(this.master);

    // Offbeat "skank" triads
    for(let b=0; b<bars*4; b++){
      const chordDegree = prog[b%prog.length];
      const base = root * Math.pow(2, chordDegree/12);
      const t = now + b*beat;

      // schedule the offbeat hit slightly after each beat
      const hit = t + beat*0.50;
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o3 = ctx.createOscillator();
      o1.type='triangle'; o2.type='triangle'; o3.type='triangle';
      o1.frequency.value = base; o2.frequency.value = base*1.25; o3.frequency.value = base*1.5;

      const env = ctx.createGain(); env.gain.setValueAtTime(0, hit);
      env.gain.linearRampToValueAtTime(this.muted?0:0.35, hit+0.005);
      env.gain.exponentialRampToValueAtTime(0.001, hit+beat*0.40);

      o1.connect(env); o2.connect(env); o3.connect(env); env.connect(gain);

      o1.start(hit); o2.start(hit); o3.start(hit);
      o1.stop(hit+beat*0.45); o2.stop(hit+beat*0.45); o3.stop(hit+beat*0.45);
    }

    // Tiny bass drop on bar 1
    const bosc = ctx.createOscillator(); bosc.type='sawtooth';
    const benv = ctx.createGain(); benv.gain.value = 0; benv.connect(gain); bosc.connect(benv);
    const t0 = now + beat*0.0;
    bosc.frequency.setValueAtTime(root/2, t0);
    benv.gain.linearRampToValueAtTime(this.muted?0:0.28, t0+0.01);
    benv.gain.exponentialRampToValueAtTime(0.0001, t0+beat*0.9);
    bosc.start(t0); bosc.stop(t0+beat*1.0);

    // return a promise that resolves when clip ends
    const endAt = now + bars*4*beat;
    return new Promise(res=> setTimeout(res, Math.max(0,(endAt-ctx.currentTime))*1000));
  }
}

/* ---------------------------- Game logic ----------------------------- */
const riff = new Riff();

const els = {
  round: document.getElementById('round-pill'),
  streak: document.getElementById('streak'),
  score: document.getElementById('score'),
  play: document.getElementById('playBtn'),
  stop: document.getElementById('stopBtn'),
  next: document.getElementById('nextBtn'),
  choices: document.getElementById('choices'),
  feedback: document.getElementById('feedback'),
  prog: document.getElementById('progbar'),
  hint: document.getElementById('hint'),
  sprite: document.getElementById('host-sprite')
};

let state = {
  idx: 0, canAnswer: false, score: 0, streak: 0, answered:false, muted:false
};

// Use a tiny embedded placeholder sprite (1×1 transparent) so the layout is stable.
// Replace with your image URL (e.g., "assets/guitarist.png").
els.sprite.src = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";

/* Render question choices */
function renderQuestion(){
  const q = QUESTIONS[state.idx];
  els.round.textContent = `Round ${state.idx+1} / ${QUESTIONS.length}`;
  els.choices.innerHTML = '';
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.setAttribute('data-i', i);
    btn.disabled = true;
    btn.addEventListener('click', ()=> choose(i));
    els.choices.appendChild(btn);
  });
  els.feedback.textContent = '';
  els.feedback.className = 'feedback';
  state.canAnswer = false;
  state.answered = false;
  els.play.classList.remove('disabled');
  els.stop.classList.add('disabled');
  els.next.classList.add('disabled');
  els.hint.textContent = 'Tap “Play clip”. When it stops, pick the correct line.';
  setProgress();
}
function setProgress(){
  const pct = (state.idx)/QUESTIONS.length*100;
  els.prog.style.width = `${pct}%`;
}
function setFinalProgress(){
  els.prog.style.width = '100%';
}

/* Play / stop controls */
async function playClip(){
  if(els.play.classList.contains('disabled')) return;
  els.play.classList.add('disabled');
  els.stop.classList.remove('disabled');
  els.hint.textContent = 'Listening… get ready!';
  // Play ~3.2s riff
  await riff.play(3.2);
  // Stop = reveal answers
  revealAnswers();
}
function revealAnswers(){
  state.canAnswer = true;
  els.stop.classList.add('disabled');
  els.hint.textContent = 'Choose the correct lyric.';
  [...els.choices.children].forEach(b=> b.disabled = false);
}
function stopEarly(){
  if(els.stop.classList.contains('disabled')) return;
  // Stopping early still reveals answers
  revealAnswers();
}

/* Answer handling */
function choose(i){
  if(!state.canAnswer || state.answered) return;
  state.answered = true;
  const q = QUESTIONS[state.idx];
  const kids = [...els.choices.children];
  kids.forEach((b,idx)=>{
    b.disabled = true;
    if(idx === q.answer) b.classList.add('correct');
  });

  if(i === q.answer){
    state.score += 100 + state.streak*10;
    state.streak += 1;
    els.feedback.textContent = `Nice! +${100 + (state.streak-1)*10} (streak ${state.streak})`;
    els.feedback.classList.add('good');
  } else {
    kids[i].classList.add('wrong');
    state.streak = 0;
    els.feedback.textContent = 'Missed it — keep grooving!';
    els.feedback.classList.add('bad');
  }
  els.score.textContent = state.score;
  els.streak.textContent = state.streak;
  els.next.classList.remove('disabled');

  // Keyboard focus
  els.next.focus();
}

/* Next round / end */
function next(){
  if(els.next.classList.contains('disabled')) return;
  state.idx++;
  if(state.idx >= QUESTIONS.length){
    setFinalProgress();
    endScreen();
  } else {
    setProgress();
    renderQuestion();
  }
}
function endScreen(){
  els.choices.innerHTML = '';
  els.hint.textContent = '';
  els.feedback.className = 'feedback good';
  els.feedback.innerHTML = `Show’s over! Final score <b>${state.score}</b>. Press “Play again” to restart.`;
  els.play.textContent = 'Play again';
  els.play.classList.remove('disabled');
  els.play.onclick = restart;
  els.stop.classList.add('disabled');
  els.next.classList.add('disabled');
  els.round.textContent = `All rounds complete`;
}

/* Restart */
function restart(){
  // reset handlers after end state
  els.play.onclick = playClip;
  els.play.textContent = 'Play clip';
  state = { idx:0, canAnswer:false, score:0, streak:0, answered:false, muted:state.muted };
  els.score.textContent = 0; els.streak.textContent = 0;
  setProgress();
  renderQuestion();
}

/* Keyboard shortcuts */
document.addEventListener('keydown', (e)=>{
  if(e.key>='1' && e.key<='4'){
    const idx = parseInt(e.key,10)-1;
    if(state.canAnswer && !state.answered){
      choose(idx);
    }
  } else if(e.key===' '){
    e.preventDefault();
    if(!els.play.classList.contains('disabled')) playClip();
  } else if(e.key.toLowerCase()==='m'){
    state.muted = !state.muted;
    riff.setMuted(state.muted);
    const msg = state.muted ? 'Muted.' : 'Sound on.';
    els.feedback.textContent = msg;
    els.feedback.className = 'feedback';
  }
});

/* Wire buttons */
els.play.addEventListener('click', playClip);
els.stop.addEventListener('click', stopEarly);
els.next.addEventListener('click', next);

/* Boot */
renderQuestion();
</script>
</body>
</html>
